<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus | Contato</title>
</head>
<body>

<header>
    <h1>Contato</h1>
    <nav>
        <ul>
            <li><a href="../index.html">Início</a></li>
            <li><a href="atividade.html">Atividade</a></li>
        </ul>
    </nav>
</header>

<main>
    <section>
        <h2>Informações</h2>
        <form>
            <fieldset>
                <div>
                    <label for="sel1">Selecione 1:</label>
                    <input type="radio" name="sel"  id="sel1" placeholder="Digite seu nome">
                    <label for="sel2">Selecione 2:</label>
                    <input type="radio" name="sel"  id="sel2" placeholder="Digite seu nome">
                </div>
                <div>
                    <label for="nome">Nome:</label>
                    <input type="text" name="nome" id="nome" placeholder="Digite seu nome">
                </div>
                 <div>
                        <label for="email">Email:</label>
                        <input type="email" name="email" id="email" placeholder="Digite seu email">
                    </div>
                    <div>
                        <textarea name="msg" id="msg" placeholder="Digite sua mensagem aqui:"></textarea>
                    </div>
                    <div>
                        <input type="submit" value="Enviar">
                    </div>
            </fieldset>
        </form>
    </section>
</main>
<footer>
    <div>
        <p>&copy; 2024 Campus. Todos os direitos reservados.</p>
    </div>
</footer>
    
</body>
</html>
